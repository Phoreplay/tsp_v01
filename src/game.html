<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tiny Pirate Ships</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Rubik:wght@700;800;900&display=swap">
<style>
/* Игра: 3D-поле на весь экран, UI в DOM по прямоугольникам из layout.js, скин из art/sprites. Один игровой вид. */
:root {
  --sea: #0E8E69; --ink: #08090B; --gold: #DEB550; --blue: #3995DF; --red: #D8524F; --panel: #264654; --pill: #1C2F3E;
  --rar: #1EFF00; --f: "Rubik", "Arial Black", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; --s: 1;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; } *, *::before, *::after { box-sizing: inherit; }
body { margin: 0; height: 100%; overflow: hidden; background: #0b5b47; color: #fff; font-family: var(--f);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#stage, #ui { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); }
#ui { pointer-events: none; }
#ui > *, .layer > * { position: absolute; }
#ui img, #stage img { max-width: none; max-height: none; }   /* страница-обёртка артефакта задаёт img { max-width: 100% }, это сжимало фон главного */
.layer { position: absolute; inset: 0; pointer-events: none; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 85% at 50% 45%, rgba(255,255,255,.07), rgba(0,0,0,0) 55%, rgba(0,25,18,.4) 100%); }
#app:not([data-screen="prep"]):not([data-screen="battle"]):not([data-screen="boarding"]):not([data-screen="cards"]):not([data-screen="enter"]) #vig { display: none; }
.txt, .float, .lbl, .n, .t, .nm { font-weight: 900; color: #fff; -webkit-text-stroke: calc(4px * var(--s)) var(--ink); paint-order: stroke fill; letter-spacing: .01em; }
img.fill { position: absolute; inset: 0; width: 100%; height: 100%; }
button, .btn, .roundBtn, .pickCard, .unitCard, .tab, .avatar { pointer-events: auto; cursor: pointer; }
.avatar::after { content: ""; position: absolute; inset: calc(-6px * var(--s)); }   /* зона касания аватара 56 pt при картинке 44 */

/* HUD */
.avatar img.emb { position: absolute; left: 18%; top: 16%; width: 64%; height: 64%; object-fit: contain; }
.avatar.isReady { filter: drop-shadow(0 0 calc(5px * var(--s)) #3fd17f); }
.cardIcon { position: absolute; right: -14%; bottom: -14%; width: 44%; height: 44%; border-radius: 22%; border: calc(2px * var(--s)) solid; background: #1a2126 center / 78% no-repeat; }
.bar { border-radius: calc(6px * var(--s)); background: rgba(0,0,0,.5); border: calc(2px * var(--s)) solid var(--ink); overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; transition: width .35s ease; }
.bar .trail { background: #ffd7a6; transition: width .6s ease .1s; }
.bar.p .fill { background: linear-gradient(#5fb0ef, #2f78dd); } .bar.e .fill { background: linear-gradient(#ef7d77, #c9433c); }
.bar.e i { left: auto; right: 0; }
.bar.crit { animation: barCrit .6s ease-in-out infinite alternate; }   /* корпус ниже 25%: полоска пульсирует красным */
@keyframes barCrit { to { box-shadow: 0 0 calc(10px * var(--s)) rgba(255,70,50,.95); border-color: #ff5a46; } }
.bar b { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(11px * var(--s)); -webkit-text-stroke: calc(3px * var(--s)) var(--ink); paint-order: stroke fill; }
.crew { display: flex; align-items: center; gap: calc(4px * var(--s)); background: rgba(0,0,0,.35); border-radius: calc(9px * var(--s)); padding: 0 calc(6px * var(--s)); }
.crew.e { flex-direction: row-reverse; }
.crew .ic { height: 80%; } .crew .n { font-size: calc(14px * var(--s)); }
.readyCheck { border-radius: 50%; background: #3fd17f; border: calc(2px * var(--s)) solid #fff; display: grid; place-items: center; font: 900 calc(12px * var(--s)) var(--f); color: #fff; }
.vs img { object-fit: contain; }
.vs .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(14px * var(--s)); padding-bottom: 6%; }
.roundN { display: grid; place-items: center; font-size: calc(13px * var(--s)); white-space: nowrap; }

/* низ */
.coins { display: flex; align-items: center; justify-content: center; gap: calc(6px * var(--s)); background: var(--pill); border: calc(2px * var(--s)) solid rgba(0,0,0,.5); border-radius: 999px; padding: 0 calc(8px * var(--s)); }
.coins .ic { height: 82%; } .coins .n { font-size: calc(18px * var(--s)); font-variant-numeric: tabular-nums; }
.income { display: grid; place-items: center; background: var(--gold); color: #1a2126; font: 900 calc(13px * var(--s)) var(--f); border-radius: 999px; border: calc(2px * var(--s)) solid #8a5a0a; }
.income.pop { animation: pop .35s ease; }
.income { transition: opacity .2s ease, transform .25s cubic-bezier(.2,1.5,.4,1); }
.income.off { opacity: 0; transform: scale(.4); }
.incomeFly { z-index: 25; pointer-events: none; transition: transform .42s cubic-bezier(.5,-.25,.6,1), opacity .42s ease-in; }
@keyframes pop { 50% { transform: scale(1.25); } }
.btn { display: grid; place-items: center; }
.btn .face, .btn .lip { position: absolute; left: 0; right: 0; border-style: solid; }
.btn .lip { bottom: 0; height: 45%; border-width: calc(10px * var(--s)); border-image: url(art/sprites/lip_blue.png) 20 fill / calc(10px * var(--s)) stretch; }
.btn .face { top: 0; bottom: calc(5px * var(--s)); border-width: calc(14px * var(--s)); border-image: url(art/sprites/btn_blue.png) 40 fill / calc(14px * var(--s)) stretch; transition: transform .08s; }
.btn.gold .face { border-image-source: url(art/sprites/btn_gold.png); } .btn.gold .lip { border-image-source: url(art/sprites/lip_gold.png); }
.btn.dark .face { border-image-source: url(art/sprites/btn_dark.png); } .btn.dark .lip { border-image-source: url(art/sprites/lip_dark.png); }
.btn:active .face { transform: translateY(calc(4px * var(--s))) scale(.97); filter: brightness(.92); }
.btn .lbl { position: relative; font-size: calc(19px * var(--s)); margin-top: calc(-4px * var(--s)); }
.btn.cta .lbl { font-size: calc(26px * var(--s)); }
.results .btn.cta .lbl { font-size: calc(22px * var(--s)); }   /* «Продолжить» длинное: на Rubik 26 px упиралось в борта кнопки */
.hireBtn { grid-template-rows: auto auto; align-content: center; }
/* акцент кнопки: ореол дышит, по лицу пробегает блик, по углам вспыхивают искры */
.btn.hot, .roundBtn.hot { z-index: 1; isolation: isolate; }
.btn.hot { animation: hotBreath 1.4s ease-in-out infinite; }
@keyframes hotBreath { 50% { transform: scale(1.045); } }
.btn.hot::before { content: ""; position: absolute; inset: -22% -10%; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,214,90,.75), rgba(255,170,40,.35) 55%, rgba(255,170,40,0)); animation: hotHalo 1.4s ease-in-out infinite; pointer-events: none; }
.btn.blue.hot::before { background: radial-gradient(closest-side, rgba(190,240,255,.95), rgba(80,170,255,.5) 55%, rgba(60,150,255,0)); }
@keyframes hotHalo { 50% { opacity: .55; transform: scale(1.08); } }
.btn .shine { position: absolute; left: 0; right: 0; top: 0; bottom: calc(5px * var(--s)); border-radius: calc(18px * var(--s)); overflow: hidden; pointer-events: none; display: none; }
.btn.hot .shine { display: block; }
.btn .shine::before, .btn .shine::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 34%; left: -60%; transform: skewX(-22deg); background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75) 45%, rgba(255,255,255,.95) 50%, rgba(255,255,255,.75) 55%, rgba(255,255,255,0)); animation: sweep 2.3s cubic-bezier(.4,0,.2,1) infinite; }
.btn .shine::after { width: 10%; animation-delay: .12s; opacity: .8; }
@keyframes sweep { 0% { left: -60%; } 45%, 100% { left: 140%; } }
.btn .spk { position: absolute; width: calc(24px * var(--s)); height: calc(24px * var(--s)); display: none; pointer-events: none; background: radial-gradient(closest-side, #fff, rgba(255,255,255,0)); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: twinkle 1.8s ease-in-out infinite; }
.btn.hot .spk { display: block; }
.btn .spk.s0 { left: 4%; top: -12%; } .btn .spk.s1 { right: 3%; top: 10%; animation-delay: .6s; width: calc(18px * var(--s)); height: calc(18px * var(--s)); } .btn .spk.s2 { left: 46%; bottom: -8%; animation-delay: 1.2s; }
@keyframes twinkle { 0%, 60%, 100% { transform: scale(0) rotate(0); } 30% { transform: scale(1.2) rotate(45deg); } }
/* круглая кнопка: бегущее кольцо света */
.roundBtn.hot { animation: hotBreath 1.4s ease-in-out infinite; }
.roundBtn.hot::before { content: ""; position: absolute; inset: 2%; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,255,255,0) 0 70%, rgba(255,255,255,.95) 80%, rgba(255,255,255,0) 90%); -webkit-mask: radial-gradient(closest-side, transparent 78%, #000 80%, #000 98%, transparent); mask: radial-gradient(closest-side, transparent 78%, #000 80%, #000 98%, transparent); animation: spin 1.2s linear infinite; pointer-events: none; z-index: 2; }
.roundBtn.hot::after { content: ""; position: absolute; inset: -14%; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, rgba(120,255,140,.7), rgba(120,255,140,0)); animation: hotHalo 1.4s ease-in-out infinite; pointer-events: none; }
/* подсветка пары для мерджа */
.mglow { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; border: calc(3px * var(--s)) solid #8ff7ff; box-shadow: 0 0 calc(14px * var(--s)) #59e8ff, inset 0 0 calc(10px * var(--s)) rgba(89,232,255,.6); animation: mg .6s ease-in-out infinite alternate; pointer-events: none; }
@keyframes mg { to { opacity: .45; transform: translate(-50%, -50%) scale(1.12); } }
.tapHand { position: absolute; width: calc(46px * var(--s)); pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); animation: tapHand .9s ease-in-out infinite; z-index: 3; }
@keyframes tapHand { 0%, 100% { transform: translate(0, 0) rotate(-20deg); } 50% { transform: translate(calc(-4px * var(--s)), calc(10px * var(--s))) rotate(-20deg) scale(.92); } }
.hireBtn .lbl { font-size: calc(19px * var(--s)); line-height: 1; }
.hireBtn .price { position: relative; display: flex; align-items: center; gap: calc(3px * var(--s)); margin-top: calc(2px * var(--s)); }
.hireBtn .price img { height: calc(15px * var(--s)); } .hireBtn .price b { font: 900 calc(15px * var(--s)) var(--f); -webkit-text-stroke: calc(3px * var(--s)) var(--ink); paint-order: stroke fill; }
.hireBtn.poor .price b { color: #ff8a80; }
.hireBtn.off { filter: grayscale(1) brightness(.75); pointer-events: none; }
/* Reroll: та же кнопка тонируется в фиолетовый (синий занят Hire, зелёный Fight, тёмный читается как выключенная, золото у главной кнопки),
   вихрь крутится внутри подписи и ничего не закрывает над кнопкой; свечение плотно к краю, чтобы не залезать на счётчик */
.hireBtn.reroll .face, .hireBtn.reroll .lip { filter: hue-rotate(38deg) saturate(1.15) brightness(.95); }
.hireBtn.reroll { animation: rrGlow 0.9s ease-in-out infinite alternate; }
.hireBtn.reroll .lbl { animation: rrFlip .12s ease-out; }
.hireBtn.reroll .lbl::before { content: ""; display: inline-block; width: 1em; height: 1em; margin-right: .22em; vertical-align: -.14em; background: url(art/sprites/ic_swirl.png) center / contain no-repeat; animation: spin 1.1s linear infinite; }
.hireBtn.reroll.armed { animation: none; transform: translateY(calc(3px * var(--s))) scale(.97); filter: drop-shadow(0 0 calc(6px * var(--s)) rgba(196,140,255,.95)) brightness(1.12); }
.hireBtn.reroll.armed .lbl::before { animation-duration: .45s; }
.hireBtn.reroll.locked .face, .hireBtn.reroll.locked .lip { filter: grayscale(1) brightness(.8); }
.hireBtn.reroll.locked { animation: none; }
@keyframes rrGlow { from { filter: drop-shadow(0 0 0 rgba(180,120,255,0)); } to { filter: drop-shadow(0 0 calc(5px * var(--s)) rgba(180,120,255,.85)); } }
@keyframes rrFlip { from { transform: rotateX(90deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
.roundBtn .rlip, .roundBtn .rface { position: absolute; left: 9%; right: 9%; top: 9%; bottom: 9%; background: url(art/sprites/round_steel.png) center / contain no-repeat; }
.roundBtn .rlip { background-image: url(art/sprites/round_lip.png); transform: translateY(calc(4px * var(--s))); }
.roundBtn.green .rface, .roundBtn.done .rface { background-image: url(art/sprites/round_green.png); }
.roundBtn.done { filter: brightness(.85); }
.roundBtn.off .rface, .roundBtn.off .lbl { filter: grayscale(1) brightness(.75); }
.roundBtn .lbl.word { font-size: calc(16px * var(--s)); letter-spacing: .02em; }
.roundBtn.green .lbl.word { animation: swordsIn .35s cubic-bezier(.3,1.8,.5,1); }
.roundBtn .lbl .swords { width: calc(42px * var(--s)); height: calc(42px * var(--s)); display: block; filter: drop-shadow(0 calc(2px * var(--s)) 0 rgba(42,14,5,.6)); }
.roundBtn.green .lbl .swords { animation: swordsIn .35s cubic-bezier(.3,1.8,.5,1); }
@keyframes swordsIn { from { transform: scale(.3) rotate(-30deg); } }
.roundBtn:active .rface { transform: translateY(calc(3px * var(--s))) scale(.96); }
.roundBtn .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.roundBtn .trk { fill: none; stroke: rgba(255,255,255,.18); stroke-width: 6; }
.roundBtn .arc { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 100 100; transition: stroke-dasharray .1s linear; }
.roundBtn.warn .arc { stroke: #ff6b5e; } .roundBtn.warn { animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.05); } }
.roundBtn .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(20px * var(--s)); padding-bottom: 4%; }
.roundBtn.x2on .rface { background-image: url(art/sprites/round_green.png); }
.no { animation: no .25s ease 3; }
@keyframes no { 25% { transform: translateX(calc(-4px * var(--s))); } 75% { transform: translateX(calc(4px * var(--s))); } }

/* баннер, полоска силы, карты */
.banner { display: grid; place-items: center; background: rgba(9,15,19,.8); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); font: 900 calc(26px * var(--s)) var(--f); -webkit-text-stroke: calc(5px * var(--s)) var(--ink); paint-order: stroke fill; pointer-events: none; }
.banner.in { animation: bin .3s ease; } @keyframes bin { from { transform: scaleY(0); opacity: 0; } }
.power { border-radius: 999px; background: linear-gradient(#ef7d77, #c9433c); border: calc(2px * var(--s)) solid var(--gold); overflow: hidden; display: grid; place-items: center; }
.power .pf { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#5fb0ef, #2f78dd); transition: width .9s cubic-bezier(.3,1.4,.5,1); }
.power b { position: relative; font: 900 calc(14px * var(--s)) var(--f); -webkit-text-stroke: calc(3px * var(--s)) var(--ink); paint-order: stroke fill; }
.cardsUi { background: rgba(3,9,12,.6); pointer-events: auto; }
.cardsTitle { display: grid; place-items: center; font-size: calc(18px * var(--s)); white-space: nowrap; }
.cardsUi { perspective: calc(900px * var(--s)); }
/* карта усиления: рамка по редкости (арт), картинка в арке под рамкой, имя на ленте, число и строка в нижней панели */
.pickCard { background: none; border: 0; transition: transform .25s cubic-bezier(.2,1.4,.4,1), opacity .25s; animation: cardIn .5s cubic-bezier(.2,1.4,.4,1) backwards; }
@keyframes cardIn { from { transform: rotateY(90deg) scale(.6); opacity: 0; } }
.pickCard .cf { position: absolute; filter: drop-shadow(0 calc(4px * var(--s)) 0 rgba(0,0,0,.45)); }
.pickCard.r2 .cf { animation: epicGlow 1.1s ease-in-out .8s infinite alternate; }
@keyframes epicGlow { from { filter: drop-shadow(0 calc(4px * var(--s)) 0 rgba(0,0,0,.45)) drop-shadow(0 0 calc(3px * var(--s)) rgba(200,140,255,.6)); } to { filter: drop-shadow(0 calc(4px * var(--s)) 0 rgba(0,0,0,.45)) drop-shadow(0 0 calc(12px * var(--s)) rgba(255,215,106,.95)); } }
.pickCard .ill { position: absolute; background: center 30% / cover no-repeat; border-radius: 50% 50% 0 0 / 34% 34% 0 0; }
.pickCard .frm { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pickCard b { position: absolute; display: grid; place-items: center; padding-bottom: 2%; font: 900 calc(12px * var(--s)) var(--f); color: #fff; -webkit-text-stroke: calc(3.5px * var(--s)) var(--ink); paint-order: stroke fill; white-space: nowrap; }
.pickCard .pan { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(1px * var(--s)); }
.pickCard em { font: 900 calc(19px * var(--s)) var(--f); font-style: normal; line-height: 1; color: #fff; -webkit-text-stroke: calc(4px * var(--s)) var(--ink); paint-order: stroke fill; }
.pickCard small { font: 800 calc(8.5px * var(--s)) var(--f); color: #fff; text-align: center; line-height: 1.12; max-height: 2.3em; padding: 0 2%; overflow: hidden; text-shadow: 0 1px 1px rgba(0,0,0,.7); }
.pickCard.r0 small { color: #4a2c12; text-shadow: none; }
.pickCard u { text-decoration: none; font: 800 calc(9px * var(--s)) var(--f); color: var(--rc); -webkit-text-stroke: calc(3px * var(--s)) var(--ink); paint-order: stroke fill; }
.pickCard .spk { position: absolute; width: calc(20px * var(--s)); height: calc(20px * var(--s)); background: radial-gradient(closest-side, #fff, rgba(255,255,255,0)); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: twinkle 1.8s ease-in-out infinite; pointer-events: none; }
.pickCard .spk.s0 { left: -8%; top: 8%; } .pickCard .spk.s1 { right: -8%; top: 42%; animation-delay: .6s; } .pickCard .spk.s2 { left: 42%; bottom: -6%; animation-delay: 1.2s; }
.pickCard.chosen { transform: scale(1.12) translateY(-6%); } .pickCard.gone { opacity: 0; transform: scale(.8) translateY(10%); }
.cspark { position: absolute; width: calc(12px * var(--s)); height: calc(12px * var(--s)); pointer-events: none; z-index: 20; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
.cardIcon.flip { animation: cflip .5s cubic-bezier(.2,1.5,.4,1); } @keyframes cflip { from { transform: rotateY(90deg) scale(1.8); } }
.float.cardName { font-size: calc(13px * var(--s)); color: #ffd84a; animation-duration: 2s; }
.tripleMark { transform: translate(-50%, -50%); border-radius: 50%; border: calc(3px * var(--s)) solid #ffd84a; box-shadow: 0 0 calc(12px * var(--s)) #ffd84a; animation: tm .5s ease-in-out infinite alternate; }
.tripleMark b { position: absolute; left: 50%; top: -32%; transform: translateX(-50%); font: 900 calc(16px * var(--s)) var(--f); color: #ffd84a; -webkit-text-stroke: calc(4px * var(--s)) var(--ink); paint-order: stroke fill; }
@keyframes tm { to { opacity: .5; transform: translate(-50%, -50%) scale(1.08); } }
.hand { width: calc(44px * var(--s)); transform: translate(-30%, -10%) rotate(-20deg); filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
.float { transform: translate(-50%, -50%); font-size: calc(17px * var(--s)); animation: fl .9s ease-out forwards; white-space: nowrap; }
.float.gold { color: #ffd84a; } .float.curse { color: #7dff9b; font-size: calc(13px * var(--s)); } .float.zap { color: #bfe8ff; font-size: calc(13px * var(--s)); } .float.boom { color: #ffb05a; font-size: calc(15px * var(--s)); } .float.block { color: #a8eeff; font-size: calc(13px * var(--s)); } .float.dmg { color: #ff8a80; font-size: calc(13px * var(--s)); } .float.heal { color: #7dff9b; } .float.ramp { font-size: calc(18px * var(--s)); color: #ffd84a; }
@keyframes fl { 0% { transform: translate(-50%, -30%) scale(.6); opacity: 0; } 20% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -160%) scale(1); opacity: 0; } }
.flyCoin { width: calc(22px * var(--s)); transform: translate(0,0); transition: transform .45s cubic-bezier(.5,-.3,.6,1); margin: calc(-11px * var(--s)) 0 0 calc(-11px * var(--s)); }
/* золото меты: слитки тяжелее монет, летят с провисом и без отскока */
.flyIngot { width: calc(34px * var(--s)); transform: translate(0,0); transition: transform .5s cubic-bezier(.6,-.25,.75,.9); margin: calc(-10px * var(--s)) 0 0 calc(-17px * var(--s)); z-index: 40; }
/* добыча: куча монет в центре, переплавка в слиток */
.lootHeap { width: calc(46px * var(--s)); height: calc(46px * var(--s)); transform: translate(-50%, -50%); z-index: 30; pointer-events: none; }
.lootHeap::before { content: ""; position: absolute; inset: -70%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,226,120,.85), rgba(255,170,40,.35) 55%, rgba(255,170,40,0)); }

    $('dCoinTone').checked = d.coinTone !== false; $('dFinisher').checked = d.finisher !== false; $('dHull').checked = d.hullStages !== false;
    $('dVolley').checked = d.volley !== false; $('dCelebrate').checked = d.celebrate !== false; $('dFinPlus').checked = d.finisherPlus !== false; $('dAngry').checked = d.angry !== false;
    $('dTime').value = d.time || 'auto'; $('dWeather').value = d.weather || 'auto';
    $('dBal').value = JSON.stringify(stripFlags(B), null, 1);
    $('dFlags').innerHTML = Object.keys(B.flags).map(function (k) { return '<label><input type="checkbox" data-f="' + k + '"' + (B.flags[k] ? ' checked' : '') + '> ' + k + '</label>'; }).join('');
    $('dFlags').querySelectorAll('input').forEach(function (i) { i.onchange = function () { B.flags[i.dataset.f] = i.checked; saveBal(); }; });
    $('dSeedNow').textContent = G.M ? 'текущий seed: ' + G.M.lastSeed : '';
  }
  function stripFlags(b) { var o = JSON.parse(JSON.stringify(b)); delete o.flags; return o; }
  function saveBal() { try { localStorage.setItem('tps-bal2', JSON.stringify(B)); } catch (e) {} }
  $('dClose').onclick = function () { dev.hidden = true; $('devPill').hidden = true; };
  $('dSkip').onchange = function (e) { G.dev.skipSearch = e.target.checked; G.saveDev(); };
  $('dShort').onchange = function (e) { G.dev.short = e.target.checked; G.saveDev(); };
  $('dFirst').onchange = function (e) { G.dev.firstScript = e.target.checked; G.saveDev(); };
  $('dSound').onchange = function (e) { G.dev.sound = e.target.checked; TPS.SFX.set(e.target.checked); G.saveDev(); };
  $('dJuice').oninput = function (e) { G.dev.juice = e.target.value / 100; G.F.setJuice(G.dev.juice); $('dJuiceV').textContent = e.target.value + '%'; G.saveDev(); };
  // пункты сочности: тон монет при сборе за убийства, добивание в замедлении с наездом камеры
  $('dCoinTone').onchange = function (e) { G.dev.coinTone = e.target.checked; G.saveDev(); };
  $('dHull').onchange = function (e) { G.dev.hullStages = e.target.checked; G.F.hullStagesOn = e.target.checked; G.saveDev(); };
  $('dFinisher').onchange = function (e) { G.dev.finisher = e.target.checked; G.saveDev(); };
  $('dVolley').onchange = function (e) { G.dev.volley = e.target.checked; G.saveDev(); };
  $('dCelebrate').onchange = function (e) { G.dev.celebrate = e.target.checked; G.saveDev(); };
  $('dFinPlus').onchange = function (e) { G.dev.finisherPlus = e.target.checked; G.saveDev(); };
  $('dAngry').onchange = function (e) { G.dev.angry = e.target.checked; G.F.angryOn = e.target.checked; G.saveDev(); };
  // атмосфера: применяется со следующего матча, на поле во время матча сразу
  $('dTime').onchange = function (e) { G.dev.time = e.target.value; G.saveDev(); if (G.M && e.target.value !== 'auto') { G.F.setAtmo({ time: e.target.value }); document.getElementById('app').dataset.time = e.target.value; } };
  $('dWeather').onchange = function (e) { G.dev.weather = e.target.value; G.saveDev(); if (G.M && e.target.value !== 'auto') { G.F.setAtmo({ weather: e.target.value }); document.getElementById('app').dataset.weather = e.target.value; } };
  $('dSeed').onchange = function (e) { G.dev.seed = e.target.value === '' ? null : e.target.value; G.saveDev(); };
  $('dReplay').onclick = function () { if (G.M) { G.dev.seed = G.M.lastSeed; $('dSeed').value = G.dev.seed; G.saveDev(); } dev.hidden = true; location.reload(); };
  $('dApply').onclick = function () {
    try { var o = JSON.parse($('dBal').value); for (var k in o) B[k] = o[k]; saveBal(); $('dMsg').textContent = 'Баланс применён. Новые числа действуют со следующего матча.'; }
    catch (e) { $('dMsg').textContent = 'Ошибка в JSON: ' + e.message; }
  };
  $('dReset').onclick = function () { try { localStorage.removeItem('tps-bal2'); } catch (e) {} var o = JSON.parse(window.TPS_BAL0); for (var k in o) B[k] = o[k]; openDev(); $('dMsg').textContent = 'Баланс сброшен к значениям из shared/balance.js.'; };
  $('dMeta').onclick = function () { G.meta.gold = 1250; G.meta.trophies = 320; G.meta.matches = 0; G.saveMeta(); location.reload(); };
  $('dCopy').onclick = function () {
    var txt = 'TPS settings ' + JSON.stringify({ dev: G.dev, flags: B.flags, bal: stripFlags(B) });
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { $('dMsg').textContent = 'Скопировано. Пришли строку в чат, она станет значениями по умолчанию.'; },
      function () { $('dMsg').textContent = txt; });
  };
  $('dRun').onclick = function () {
    $('dOut').textContent = 'Считаю…';
    setTimeout(function () {
      var t0 = performance.now(), r = TPS.BOT.runMany(1000, B), pct = function (x) { return (x / r.n * 100).toFixed(1) + '%'; };
      var cards = Object.keys(r.cards).map(function (k) { return '  ' + k + ': ' + r.cards[k].n + ' раз, винрейт ' + (r.cards[k].win / r.cards[k].n * 100).toFixed(0) + '%'; }).join('\n');
      $('dOut').textContent = 'Исходы: потопление ' + pct(r.sink) + ', выбитая команда ' + pct(r.wipe) + ', абордаж ' + pct(r.board) + '\n' +
        'Корпус после 2 раундов в среднем ' + Math.round(r.hull2 * 100) + '%\nМатч около ' + Math.round(r.len) + ' с на x1, абордаж ' + r.boardSec.toFixed(1) + ' с\n' +
        'Лидер по убийствам в 1-м раунде выигрывает ' + (r.snow.lead ? Math.round(r.snow.leadWin / r.snow.lead * 100) : 0) + '% из ' + r.snow.lead + '\n' +
        'Добыча: победа ' + r.loot.win.toFixed(1) + ', поражение ' + r.loot.loss.toFixed(1) + '; золото всего: победа ' + r.gold.win.toFixed(0) + ', поражение ' + r.gold.loss.toFixed(0) + '\nКарты:\n' + cards +
        '\n' + Math.round(performance.now() - t0) + ' мс';
    }, 30);
  };
})();
</script>
</body>
</html>
